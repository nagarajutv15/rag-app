apiVersion: apps/v1
king: Deployment

metadata:
  name: postgres
  namespace: rag-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres
    
  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: POSTGRES_DB

            - name: POSTGRES_USER
              value: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              value: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

