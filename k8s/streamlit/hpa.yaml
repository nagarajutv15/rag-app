apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: rag-streamlit-hpa
  namespace: rag-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-streamlit

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70